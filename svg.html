<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dynasty 8 – Éditeur de zones</title>
<link rel="icon" href="assets/logo_site.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#05170d;
  --bg-panel:#081d11;
  --bg-panel-2:#0c2416;
  --bg-raised:#0f2c1a;
  --hairline:rgba(244,241,232,.10);
  --hairline-strong:rgba(244,241,232,.18);
  --ink:#f3efe4;
  --ink-dim:rgba(243,239,228,.62);
  --ink-faint:rgba(243,239,228,.38);
  --gold:#e0b13d;
  --gold-soft:rgba(224,177,61,.14);
  --green:#3fae66;
  --green-deep:#173a24;
  --red:#e0685f;
  --red-soft:rgba(214,77,77,.15);
  --blue:#4fa8d8;
  --purple:#a06bd6;
  --font-display:'Cormorant Garamond', Georgia, serif;
  --font-body:'DM Sans','Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.8,.22,1);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--ink);
  display:flex;
  height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   PANNEAU LATÉRAL
   ============================================================ */
#panel {
  width:330px; min-width:330px;
  background:var(--bg-panel);
  border-right:1px solid var(--hairline);
  display:flex; flex-direction:column; overflow:hidden;
}

#panel h1 {
  padding:16px 18px;
  font-family:var(--font-display);
  font-size:16px; font-weight:600;
  background:var(--bg-panel-2);
  border-bottom:1px solid var(--hairline);
  display:flex; flex-direction:column; gap:10px;
}
#panel h1 > span { color:var(--ink); }
#panel h1 > span em { color:var(--gold); font-style:normal; }

.h1-actions { display:flex; gap:6px; flex-wrap:wrap; }
.h1-actions button {
  flex:1; min-width:64px;
  border:1px solid transparent;
  border-radius:7px;
  padding:7px 8px;
  font-size:10.5px; font-weight:600; letter-spacing:.2px;
  font-family:var(--font-body);
  cursor:pointer;
  transition:filter .15s, transform .15s;
  white-space:nowrap;
}
.h1-actions button:hover { filter:brightness(1.15); transform:translateY(-1px); }
#btn-charger  { background:rgba(79,168,216,.15); color:var(--blue);  border-color:rgba(79,168,216,.3); }
#btn-publier  { background:rgba(160,107,214,.15); color:var(--purple); border-color:rgba(160,107,214,.3); }
#btn-remplacer{ background:var(--red-soft); color:var(--red); border-color:rgba(214,77,77,.3); }
#btn-voir     { background:rgba(63,174,102,.15); color:var(--green); border-color:rgba(63,174,102,.3); }

#btn-creer-zone {
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin:12px 12px 6px;
  padding:12px 14px;
  background:var(--green-deep);
  border:1px solid var(--green);
  border-radius:9px;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:12.5px; font-weight:700; letter-spacing:.2px;
  cursor:pointer;
  transition:background .18s var(--ease), transform .15s var(--ease);
}
#btn-creer-zone:hover { background:var(--green); color:var(--bg-deep); transform:translateY(-1px); }
#btn-creer-zone:active { transform:translateY(0); }
#btn-creer-zone .plus-icon {
  display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:18px;
  background:rgba(255,255,255,.18);
  border-radius:50%;
  font-size:13px; font-weight:700; line-height:1;
}

#zones-list {
  flex:1; overflow-y:auto;
  padding:10px 12px;
  display:flex; flex-direction:column; gap:6px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent;
}
#zones-list::-webkit-scrollbar { width:6px; }
#zones-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:10px; }

.zones-empty {
  color:var(--ink-faint); font-size:12.5px; text-align:center;
  padding:32px 14px; line-height:1.6;
}

.zi {
  border:1px solid var(--hairline);
  border-radius:10px;
  padding:11px 12px;
  background:rgba(255,255,255,.02);
  transition:border-color .15s, background .15s;
}
.zi.active { border-color:var(--gold); background:var(--gold-soft); }

.zid {
  font-size:10px; color:var(--ink-faint);
  font-family:'DM Sans',monospace;
  letter-spacing:.3px;
  margin-bottom:6px;
}

.zh { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.zdot {
  width:16px; height:16px; border-radius:50%; flex-shrink:0; cursor:pointer;
  border:2px solid rgba(255,255,255,.3);
  transition:transform .15s;
}
.zdot:hover { transform:scale(1.15); }
.zname {
  font-size:12.5px; font-weight:600; flex:1;
  background:none; border:none; color:var(--ink); outline:none;
  padding:3px 5px; border-radius:5px;
  font-family:var(--font-body);
}
.zname:focus { background:rgba(255,255,255,.06); }
.zcount { font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }

.zbtns { display:flex; gap:5px; flex-wrap:wrap; }
.zbtns button {
  flex:1; min-width:66px;
  padding:6px 4px;
  font-size:10.5px; font-weight:600;
  font-family:var(--font-body);
  border-radius:6px;
  border:1px solid var(--hairline);
  background:rgba(255,255,255,.04);
  color:var(--ink-dim);
  cursor:pointer;
  transition:background .15s, color .15s;
}
.zbtns button:hover { background:rgba(255,255,255,.09); color:var(--ink); }
.zbtns .del { border-color:rgba(214,77,77,.3); color:var(--red); }
.zbtns .del:hover { background:var(--red-soft); }

/* ============================================================
   SORTIE CODE
   ============================================================ */
#out-section {
  padding:14px;
  border-top:1px solid var(--hairline);
  background:var(--bg-panel-2);
}
#out-section h2 {
  font-size:10.5px; color:var(--ink-faint);
  margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;
  font-weight:700;
}
#out {
  font-family:'SF Mono','Consolas',monospace;
  font-size:11px;
  background:rgba(0,0,0,.35);
  border:1px solid var(--hairline);
  border-radius:8px;
  padding:11px;
  max-height:190px; overflow-y:auto;
  white-space:pre;
  color:#8ecae6;
  line-height:1.55;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent;
}
#copybtn {
  margin-top:9px; width:100%; padding:9px;
  background:rgba(63,174,102,.15);
  border:1px solid rgba(63,174,102,.3);
  color:var(--green);
  border-radius:8px;
  font-family:var(--font-body);
  font-size:12px; font-weight:700;
  cursor:pointer;
  transition:background .15s;
}
#copybtn:hover { background:var(--green); color:var(--bg-deep); }

/* ============================================================
   CARTE
   ============================================================ */
#map-wrapper { flex:1; position:relative; overflow:hidden; background:#0c2d52; }
#mc { position:absolute; transform-origin:0 0; cursor:crosshair; }
#mc img { display:block; height:2048px; width:auto; user-select:none; pointer-events:none; }
#ms { position:absolute; top:0; left:0; width:100%; height:100%; }

#bar {
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  display:flex; gap:12px;
  background:rgba(8,29,17,.92);
  border:1px solid var(--hairline);
  border-radius:9px;
  padding:9px 16px;
  z-index:100; align-items:center;
  font-size:11.5px; color:var(--ink-dim);
  white-space:nowrap;
  backdrop-filter:blur(6px);
}
#bar kbd {
  background:rgba(255,255,255,.08);
  border:1px solid var(--hairline-strong);
  border-radius:4px;
  padding:1px 6px;
  font-size:10.5px; color:var(--ink);
  font-family:var(--font-body);
}
#st {
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  background:rgba(8,29,17,.9);
  border:1px solid var(--hairline);
  border-radius:8px;
  padding:7px 16px;
  font-size:12px; color:var(--ink-dim);
  z-index:100; pointer-events:none; white-space:nowrap;
}

/* ============================================================
   OVERLAY FORMULAIRE
   ============================================================ */
.d8-overlay {
  position:fixed; inset:0;
  background:rgba(2,10,5,.72);
  backdrop-filter:blur(4px);
  z-index:99999;
  display:none; align-items:center; justify-content:center;
}
.d8-overlay.open { display:flex; }
.d8-box {
  background:var(--bg-panel);
  border:1px solid var(--hairline-strong);
  border-radius:14px;
  padding:26px;
  width:360px; max-width:90vw;
  max-height:88vh; overflow-y:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.5);
  animation:d8In .2s var(--ease);
}
@keyframes d8In {
  from{ opacity:0; transform:translateY(10px) scale(.98); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
.d8-box h3 {
  font-family:var(--font-display);
  font-size:19px; font-weight:600;
  color:var(--ink);
  margin-bottom:18px;
}
.d8-box label {
  display:block; font-size:11px; font-weight:600;
  color:var(--ink-faint); text-transform:uppercase; letter-spacing:.5px;
  margin-bottom:7px; margin-top:16px;
}
.d8-box input[type=text] {
  width:100%; padding:10px 12px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--hairline);
  border-radius:8px;
  color:var(--ink); font-size:13px;
  font-family:var(--font-body);
  transition:border-color .15s;
}
.d8-box input[type=text]:focus { outline:none; border-color:var(--gold); }
.d8-box input[type=file] {
  width:100%; font-size:12px; color:var(--ink-dim);
  padding:8px 0;
}

.palette { display:flex; flex-wrap:wrap; gap:9px; margin-top:9px; }
.swatch {
  width:27px; height:27px; border-radius:50%; cursor:pointer;
  border:2px solid transparent;
  transition:transform .12s var(--ease);
}
.swatch:hover { transform:scale(1.15); }
.swatch.selected { border-color:var(--ink); box-shadow:0 0 0 2px var(--bg-deep); }

.custom-color-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
.custom-color-row input[type=color] {
  width:42px; height:30px; border:1px solid var(--hairline); border-radius:6px;
  background:none; cursor:pointer; padding:0;
}
.custom-color-row span { font-size:11px; color:var(--ink-faint); }

.type-toggle { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
.type-toggle button {
  flex:1; min-width:96px; padding:9px 8px;
  border-radius:8px; border:1px solid var(--hairline);
  background:rgba(255,255,255,.02);
  color:var(--ink-dim); cursor:pointer;
  font-family:var(--font-body); font-size:11.5px; font-weight:600;
  transition:background .15s, border-color .15s, color .15s;
}
.type-toggle button.active {
  background:var(--green-deep); border-color:var(--green); color:var(--ink);
}

.d8-box-actions { display:flex; gap:10px; margin-top:22px; }
.d8-box-actions button {
  flex:1; padding:11px; border:1px solid transparent; border-radius:9px;
  font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer;
  transition:filter .15s, transform .15s;
}
.d8-box-actions button:hover { filter:brightness(1.1); transform:translateY(-1px); }
.btn-cancel-red { background:var(--red-soft); color:var(--red); border-color:rgba(214,77,77,.3); }
.btn-save-green { background:var(--green-deep); color:var(--ink); border-color:var(--green); }
</style>
</head>
<body>

<script>
// Désactivé pour l'usage en local
// (async function verifierAccesOwner() {
//     ...
// })();
</script>

<div id="panel">
  <h1>
    <span>Dynasty <em>8</em> — Éditeur de zones</span>
    <div class="h1-actions">
      <button id="btn-charger" onclick="chargerDepuisServeur()">📥 Charger</button>
      <button id="btn-publier" onclick="publierSurServeur()">☁️ Ajouter</button>
      <button id="btn-remplacer" onclick="remplacerTout()">🔄 Remplacer</button>
      <button id="btn-voir" onclick="window.open('carte.html', 'dynasty8-carte')">👁️ Carte</button>
    </div>
  </h1>
  <button id="btn-creer-zone" onclick="ouvrirFormNouvelleZone()">
    <span class="plus-icon">+</span> Créer une nouvelle zone
  </button>
  <div id="zones-list"></div>
  <div id="out-section">
    <h2>Code SVG</h2>
    <div id="out">Cliquez sur la carte pour commencer...</div>
    <button id="copybtn" onclick="doCopy()">Copier le code</button>
  </div>
</div>

<div id="map-wrapper">
  <div id="bar">
    <span><kbd>Clic gauche</kbd> Ajouter un point</span>
    <span style="color:var(--ink-faint)">·</span>
    <span><kbd>Glisser un point</kbd> Le déplacer</span>
    <span style="color:var(--ink-faint)">·</span>
    <span><kbd>Double-clic</kbd> Supprimer ce point</span>
    <span style="color:var(--ink-faint)">·</span>
    <span><kbd>Clic droit + glisser</kbd> Déplacer la carte</span>
  </div>
  <div id="mc">
    <img id="mi" src="assets/map_gta.jpg" alt="carte">
    <svg id="ms" viewBox="0 0 2048 2048" width="100%" height="100%"></svg>
  </div>
  <div id="st">Chargement...</div>
</div>

<!-- ---- Formulaire nouvelle zone / renommer ---- -->
<div class="d8-overlay" id="overlay-form">
  <div class="d8-box">
    <h3 id="form-title">🆕 Nouvelle zone</h3>
    <label>Nom de la zone</label>
    <input type="text" id="form-nom" placeholder="Ex: Paleto Bay">

    <label>Type</label>
    <div class="type-toggle">
      <button type="button" id="type-poly" class="active" onclick="choisirType('poly')">🔷 Zone (polygone)</button>
      <button type="button" id="type-cross" onclick="choisirType('cross')">✕ Repère (croix)</button>
      <button type="button" id="type-icon" onclick="choisirType('icon')">🏢 Repère (bâtiment)</button>
    </div>

    <div id="field-numero" style="display:none;">
      <label>Numéro (ex: 475)</label>
      <input type="text" id="form-numero" placeholder="Ex: 475">
    </div>

    <label>Couleur</label>
    <div class="palette" id="palette"></div>
    <div class="custom-color-row">
      <input type="color" id="form-color-custom" value="#3a8246" oninput="selectionnerCouleurCustom(this.value)">
      <span>Couleur personnalisée</span>
    </div>

    <label>Image au survol (optionnel)</label>
    <input type="file" id="form-image-file" accept="image/*">
    <div id="form-image-preview" style="margin-top:10px;"></div>

    <div class="d8-box-actions">
      <button class="btn-cancel-red" onclick="fermerFormZone()">✕ Annuler</button>
      <button class="btn-save-green" onclick="validerFormZone()">💾 Créer</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  PALETTE DE COULEURS
// ============================================================
const PALETTE_PRESET = [
  "#c8a820", "#3a8246", "#8b2020", "#7a2e7a", "#3264c8", "#c77c1a",
  "#2ecc71", "#e74c3c", "#9b59b6", "#3498db", "#f39c12", "#1abc9c",
  "#e91e63", "#607d8b", "#795548", "#ff5722"
];

// ============================================================
//  SYNCHRONISATION AVEC LE SERVEUR
// ============================================================
const SERVER_URL = (location.hostname === '127.0.0.1' || location.hostname === 'localhost')
  ? 'http://localhost:3000'
  : 'https://dynasty8-skyfa.sub-yorkhost.fr';

async function chargerDepuisServeur() {
  try {
    const res = await fetch(`${SERVER_URL}/api/zones-shapes`, { credentials: "include" });
    if (!res.ok) { st.textContent = "⚠️ Accès refusé (connecte-toi en Owner sur le site)."; return; }
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) { st.textContent = "Aucune zone enregistrée côté serveur pour le moment."; return; }
    ZONES = data;
    active = ZONES[0] || null;
    buildPanel();
    render();
    genCode();
    st.textContent = "Zones chargées depuis le site ✓";
  } catch(e) { st.textContent = "❌ Erreur de connexion au serveur"; }
}

async function publierSurServeur() {
  if (!ZONES.length) { st.textContent = "⚠️ Aucune zone à publier."; return; }
  if (!confirm("Ajouter ces zones par-dessus celles déjà publiées sur le site ?")) return;
  try {
    const existingRes = await fetch(`${SERVER_URL}/api/zones-shapes`, { credentials: "include" });
    const zonesExistantes = existingRes.ok ? await existingRes.json() : []; // ← tableau brut, plus { zones: [] }
    const zonesExistantesIds = new Set(zonesExistantes.map(z => z.id));
    const nouvellesZones = ZONES.filter(z => !zonesExistantesIds.has(z.id));
    const zonesFusionnees = [...zonesExistantes, ...nouvellesZones];
    const res = await fetch(`${SERVER_URL}/api/zones-shapes`, {
      method: "PUT",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zones: zonesFusionnees })
    });
    if (!res.ok) { st.textContent = "❌ Échec de la publication (accès Owner requis)."; return; }
    st.textContent = `✅ ${nouvellesZones.length} zone(s) ajoutée(s) — total : ${zonesFusionnees.length}`;
  } catch(e) { st.textContent = "❌ Erreur de connexion au serveur"; }
}

async function remplacerTout() {
  if (!ZONES.length) { st.textContent = "⚠️ Aucune zone à publier."; return; }
  if (!confirm("⚠️ Remplacer TOUTES les zones du site par celles-ci ? Cette action est irréversible.")) return;
  try {
    const res = await fetch(`${SERVER_URL}/api/zones-shapes`, {
      method: "PUT",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zones: ZONES })
    });
    if (!res.ok) { st.textContent = "❌ Échec (accès Owner requis)."; return; }
    st.textContent = `✅ ${ZONES.length} zone(s) publiée(s) — remplacement complet.`;
  } catch(e) { st.textContent = "❌ Erreur de connexion au serveur"; }
}

// ============================================================
//  ÉTAT
// ============================================================
var ZONES = []; // { id, name, color, kind: 'poly'|'cross'|'icon', number, pts: [{x,y}] }
var active = null;
var _zoneCounter = 0;

var ms = { zoom:1, x:0, y:0, drag:false, sx:0, sy:0 };
var svg  = document.getElementById('ms');
var mi   = document.getElementById('mi');
var mc   = document.getElementById('mc');
var wrap = document.getElementById('map-wrapper');
var st   = document.getElementById('st');

var draggedPoint = null;

window.addEventListener('mousemove', function(e) {
    if (!draggedPoint) return;
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    var svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    draggedPoint.zone.pts[draggedPoint.index] = { x: Math.round(svgP.x), y: Math.round(svgP.y) };
    render();
});
window.addEventListener('mouseup', function() {
    if (draggedPoint) { buildPanel(); genCode(); draggedPoint = null; }
});

svg.setAttribute('viewBox', '0 0 2048 2048');

function initSVG() {
  if (!mi.naturalWidth) return;
  st.textContent = active ? ('Prêt. Zone active : ' + active.name) : 'Crée une zone pour commencer (+ Zone)';
}
mi.addEventListener('load', initSVG);
if (mi.complete) initSVG();

function normaliserId(nom) {
  return nom
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "") || ("zone_" + (++_zoneCounter));
}

function idUnique(base) {
  let id = base, i = 2;
  while (ZONES.some(z => z.id === id)) { id = base + "_" + i; i++; }
  return id;
}

// ============================================================
//  FORMULAIRE NOUVELLE ZONE
// ============================================================
let _typeFormActuel = 'poly';
let _imageFormFile = null;      // fichier tout juste sélectionné (pas encore uploadé)
let _imageFormExistante = "";   // URL déjà en ligne (mode modification)
let _couleurFormActuelle = PALETTE_PRESET[0];
let _renameCible = null; // si non-null, on est en mode "renommer/recolorer" plutôt que "créer"

function renderPalette() {
  const wrap = document.getElementById('palette');
  wrap.innerHTML = PALETTE_PRESET.map(c => `
    <div class="swatch ${c === _couleurFormActuelle ? 'selected' : ''}" style="background:${c}" onclick="selectionnerCouleurPreset('${c}')"></div>
  `).join('');
}

function renderImagePreview() {
  const wrap = document.getElementById('form-image-preview');
  if (_imageFormFile) {
    const reader = new FileReader();
    reader.onload = e => {
      wrap.innerHTML = `
        <div style="position:relative; width:90px; display:inline-block;">
          <img src="${e.target.result}" style="width:90px; height:60px; object-fit:cover; border-radius:8px; border:2px solid var(--green);">
          <button type="button" onclick="retirerImageForm()" style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:var(--red); color:white; font-size:12px; cursor:pointer; line-height:1;">✕</button>
        </div>`;
    };
    reader.readAsDataURL(_imageFormFile);
  } else if (_imageFormExistante) {
    wrap.innerHTML = `
      <div style="position:relative; width:90px; display:inline-block;">
        <img src="${_imageFormExistante}" style="width:90px; height:60px; object-fit:cover; border-radius:8px; border:2px solid var(--hairline-strong);">
        <button type="button" onclick="retirerImageForm()" style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:var(--red); color:white; font-size:12px; cursor:pointer; line-height:1;">✕</button>
      </div>`;
  } else {
    wrap.innerHTML = `<p style="color:var(--ink-faint); font-size:11px; margin:0;">Aucune image sélectionnée</p>`;
  }
}

function retirerImageForm() {
  _imageFormFile = null;
  _imageFormExistante = "";
  document.getElementById('form-image-file').value = "";
  renderImagePreview();
}

function selectionnerCouleurPreset(c) {
  _couleurFormActuelle = c;
  document.getElementById('form-color-custom').value = c;
  renderPalette();
}
function selectionnerCouleurCustom(c) {
  _couleurFormActuelle = c;
  renderPalette();
}

function choisirType(type) {
  _typeFormActuel = type;
  document.getElementById('type-poly').classList.toggle('active', type === 'poly');
  document.getElementById('type-cross').classList.toggle('active', type === 'cross');
  document.getElementById('type-icon').classList.toggle('active', type === 'icon');
  document.getElementById('field-numero').style.display = (type === 'icon') ? 'block' : 'none';
}

function ouvrirFormNouvelleZone() {
  _renameCible = null;
  _typeFormActuel = 'poly';
  _couleurFormActuelle = PALETTE_PRESET[ZONES.length % PALETTE_PRESET.length];
  document.getElementById('form-title').textContent = '🆕 Nouvelle zone';
  document.getElementById('form-nom').value = '';
  document.getElementById('form-numero').value = '';
  _imageFormFile = null;
  _imageFormExistante = '';
  document.getElementById('form-image-file').value = '';
  document.getElementById('form-color-custom').value = _couleurFormActuelle;
  choisirType('poly');
  renderPalette();
  renderImagePreview();
  document.getElementById('overlay-form').classList.add('open');
  setTimeout(() => document.getElementById('form-nom').focus(), 50);
}

function ouvrirFormRenommer(zoneId) {
  const z = ZONES.find(zz => zz.id === zoneId);
  if (!z) return;
  _renameCible = zoneId;
  _typeFormActuel = z.kind;
  _couleurFormActuelle = z.color;
  document.getElementById('form-title').textContent = '✏️ Modifier la zone';
  document.getElementById('form-nom').value = z.name;
  document.getElementById('form-numero').value = z.number || '';
  _imageFormFile = null;
  _imageFormExistante = z.image || '';
  document.getElementById('form-image-file').value = '';
  document.getElementById('form-color-custom').value = z.color;
  choisirType(z.kind);
  renderPalette();
  renderImagePreview();
  document.getElementById('overlay-form').classList.add('open');
}

function fermerFormZone() {
  document.getElementById('overlay-form').classList.remove('open');
}

async function validerFormZone() {
  const nom = document.getElementById('form-nom').value.trim();
  if (!nom) { alert('Merci de donner un nom à la zone.'); return; }
  const numero = document.getElementById('form-numero').value.trim();

  const btn = document.querySelector('#overlay-form .btn-save-green');
  const texteOriginal = btn.textContent;
  btn.textContent = 'Enregistrement...';
  btn.disabled = true;

  let imageUrl = _imageFormExistante || "";

  if (_imageFormFile) {
    try {
      const formData = new FormData();
      formData.append("photos", _imageFormFile);
      const uploadRes = await fetch(`${SERVER_URL}/api/upload-photos`, {
        method: "POST", credentials: "include", body: formData
      });
      const { urls } = await uploadRes.json();
      imageUrl = urls[0];
    } catch(e) {
      alert("Erreur lors de l'upload de l'image.");
      btn.textContent = texteOriginal;
      btn.disabled = false;
      return;
    }
  }

  if (_renameCible) {
    const z = ZONES.find(zz => zz.id === _renameCible);
    if (z) {
      z.name = nom;
      z.color = _couleurFormActuelle;
      z.kind = _typeFormActuel;
      z.number = numero;
      z.image = imageUrl;
    }
  } else {
    const id = idUnique(normaliserId(nom));
    const zone = { id, name: nom, color: _couleurFormActuelle, kind: _typeFormActuel, number: numero, image: imageUrl, pts: [] };
    ZONES.push(zone);
    active = zone;
  }

  btn.textContent = texteOriginal;
  btn.disabled = false;

  fermerFormZone();
  buildPanel();
  render();
  genCode();
  st.textContent = 'Zone active : ' + (active ? active.name : '');
}

// ============================================================
//  PANNEAU LATÉRAL
// ============================================================
function buildPanel() {
  const list = document.getElementById('zones-list');
  list.innerHTML = '';

  if (ZONES.length === 0) {
    list.innerHTML = `<p class="zones-empty">Aucune zone pour l'instant.<br>Clique sur « + Créer une nouvelle zone » pour commencer.</p>`;
    return;
  }

  const suffixeType = { cross: ' · repère', icon: ' · bâtiment' };

  ZONES.forEach(function(z) {
    const d = document.createElement('div');
    d.className = 'zi' + (z === active ? ' active' : '');
    d.innerHTML =
      '<div class="zid">' + z.id + (suffixeType[z.kind] || '') + '</div>' +
      '<div class="zh">' +
        '<div class="zdot" style="background:' + z.color + '" title="Changer la couleur / le nom" onclick="ouvrirFormRenommer(\'' + z.id + '\')"></div>' +
        '<input class="zname" value="' + z.name.replace(/"/g,'&quot;') + '" onchange="renommerRapide(\'' + z.id + '\', this.value)">' +
        '<span class="zcount">' + z.pts.length + ' pts</span>' +
      '</div>' +
      '<div class="zbtns">' +
        '<button onclick="sel(\'' + z.id + '\')">🎯 Éditer</button>' +
        '<button onclick="undo(\'' + z.id + '\')">↩️ Annuler pt</button>' +
        '<button class="del" onclick="clr(\'' + z.id + '\')">🗑️ Vider pts</button>' +
        '<button class="del" onclick="supprimerZone(\'' + z.id + '\')">❌ Supprimer</button>' +
      '</div>';
    list.appendChild(d);
  });
}

function getZone(id) { return ZONES.find(function(z){ return z.id === id; }); }

function sel(id) { active = getZone(id); buildPanel(); st.textContent = 'Zone active : ' + active.name; }

function renommerRapide(id, nouveauNom) {
  const z = getZone(id);
  if (z && nouveauNom.trim()) z.name = nouveauNom.trim();
  buildPanel();
}

function undo(id) { var z = getZone(id); if (z.pts.length) z.pts.pop(); render(); buildPanel(); genCode(); }

function clr(id) {
  if (!confirm('Vider les points de cette zone ?')) return;
  getZone(id).pts = [];
  render(); buildPanel(); genCode();
}

function supprimerZone(id) {
  const z = getZone(id);
  if (!z) return;
  if (!confirm('Supprimer définitivement la zone "' + z.name + '" ?')) return;
  ZONES = ZONES.filter(zz => zz.id !== id);
  if (active && active.id === id) active = ZONES[0] || null;
  buildPanel(); render(); genCode();
}

// ============================================================
//  DESSIN SUR LA CARTE
// ============================================================
mc.addEventListener('click', function(e) {
  if (e.button !== 0) return;
  if (!active) { st.textContent = "⚠️ Crée d'abord une zone avec + Zone"; return; }
  var pt  = svg.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  var svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
  var x = Math.round(svgP.x);
  var y = Math.round(svgP.y);
  active.pts.push({ x:x, y:y });
  render(); buildPanel(); genCode();
  st.textContent = 'Point (' + x + ', ' + y + ') ajouté dans : ' + active.name;
});

var NS = 'http://www.w3.org/2000/svg';
function mk(tag) { return document.createElementNS(NS, tag); }

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function render() {
  svg.innerHTML = '';
  ZONES.forEach(function(z) {
    if (z.pts.length === 0) return;

    if (z.kind === 'poly') {
      if (z.pts.length >= 3) {
        var poly = mk('polygon');
        poly.setAttribute('points', z.pts.map(function(p){ return p.x + ',' + p.y; }).join(' '));
        poly.setAttribute('fill', hexToRgba(z.color, 0.4));
        poly.setAttribute('stroke', z.color);
        poly.setAttribute('stroke-width', '3');
        svg.appendChild(poly);
      }
      z.pts.forEach(function(p, i) {
          var c = mk('circle');
          c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
          c.setAttribute('r', '7');
          c.setAttribute('fill', z.color);
          c.setAttribute('stroke', '#fff');
          c.setAttribute('stroke-width', '2');
          c.style.cursor = 'grab';

          c.addEventListener('mousedown', function(ev) {
              ev.stopPropagation();
              draggedPoint = { zone: z, index: i };
          });
          c.addEventListener('click', function(ev) { ev.stopPropagation(); });
          c.addEventListener('dblclick', function(ev) {
              ev.stopPropagation();
              z.pts.splice(i, 1);
              render(); buildPanel(); genCode();
          });

          svg.appendChild(c);
          var t = mk('text');
          t.setAttribute('x', p.x + 10);
          t.setAttribute('y', p.y + 5);
          t.setAttribute('fill', '#fff');
          t.setAttribute('font-size', '14');
          t.setAttribute('font-weight', 'bold');
          t.textContent = i + 1;
          svg.appendChild(t);
      });

    } else if (z.kind === 'cross') {
      z.pts.forEach(function(p, i) {
        var g = mk('g');
        g.style.cursor = 'grab';

        var S = 20;
        var pairs = [
          [p.x - S, p.y - S, p.x + S, p.y + S],
          [p.x + S, p.y - S, p.x - S, p.y + S]
        ];
        pairs.forEach(function(coords) {
          var l = mk('line');
          l.setAttribute('x1', coords[0]); l.setAttribute('y1', coords[1]);
          l.setAttribute('x2', coords[2]); l.setAttribute('y2', coords[3]);
          l.setAttribute('stroke', z.color);
          l.setAttribute('stroke-width', '12');
          l.setAttribute('stroke-linecap', 'round');
          g.appendChild(l);
        });

        g.addEventListener('mousedown', function(ev) {
            ev.stopPropagation();
            draggedPoint = { zone: z, index: i };
        });
        g.addEventListener('click', function(ev) { ev.stopPropagation(); });
        g.addEventListener('dblclick', function(ev) {
            ev.stopPropagation();
            z.pts.splice(i, 1);
            render(); buildPanel(); genCode();
        });

        svg.appendChild(g);
      });

    } else if (z.kind === 'icon') {
      z.pts.forEach(function(p, i) {
        var g = mk('g');
        g.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');
        g.style.cursor = 'grab';

        var icon = mk('text');
        icon.setAttribute('x', 0); icon.setAttribute('y', 0);
        icon.setAttribute('text-anchor', 'middle');
        icon.setAttribute('font-size', '15');
        icon.textContent = '🏢';
        g.appendChild(icon);

        var num = mk('text');
        num.setAttribute('x', 0); num.setAttribute('y', 12);
        num.setAttribute('text-anchor', 'middle');
        num.setAttribute('fill', '#fff');
        num.setAttribute('font-size', '7');
        num.setAttribute('font-weight', 'bold');
        num.setAttribute('paint-order', 'stroke');
        num.setAttribute('stroke', '#000');
        num.setAttribute('stroke-width', '2');
        num.setAttribute('stroke-linejoin', 'round');
        num.textContent = z.number || (i + 1);
        g.appendChild(num);

        var label = mk('text');
        label.setAttribute('x', 0); label.setAttribute('y', 21);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('fill', '#fff');
        label.setAttribute('font-size', '6');
        label.setAttribute('paint-order', 'stroke');
        label.setAttribute('stroke', '#000');
        label.setAttribute('stroke-width', '2');
        label.setAttribute('stroke-linejoin', 'round');
        label.textContent = z.name;
        g.appendChild(label);

        g.addEventListener('mousedown', function(ev) {
            ev.stopPropagation();
            draggedPoint = { zone: z, index: i };
        });
        g.addEventListener('click', function(ev) { ev.stopPropagation(); });
        g.addEventListener('dblclick', function(ev) {
            ev.stopPropagation();
            z.pts.splice(i, 1);
            render(); buildPanel(); genCode();
        });

        svg.appendChild(g);
      });
    }
  });
}

// ============================================================
//  EXPORT DU CODE
// ============================================================
function genCode() {
  var lines = ['<svg viewBox="0 0 2048 2048" class="map-svg-layer">', ''];
  ZONES.forEach(function(z) {
    if (z.pts.length === 0) return;
    lines.push('    <!-- ' + z.name + ' -->');
    if (z.kind === 'poly' && z.pts.length >= 3) {
      var pts = z.pts.map(function(p){ return p.x + ',' + p.y; }).join(' ');
      var fillRgba = hexToRgba(z.color, 0.4);
      lines.push('    <polygon class="map-zone"');
      lines.push('        style="fill:' + fillRgba + '; stroke:' + z.color + ';"');
      lines.push('        points="' + pts + '"');
      lines.push('        onclick="openCoherences(\'' + z.id + '\')"/>');
    } else if (z.kind === 'cross') {
      z.pts.forEach(function(p) {
        lines.push('    <g class="map-x" transform="translate(' + p.x + ',' + p.y + ')" style="--map-x-color:' + z.color + ';">');
        lines.push('        <line x1="-20" y1="-20" x2="20" y2="20" stroke="' + z.color + '"/>');
        lines.push('        <line x1="20" y1="-20" x2="-20" y2="20" stroke="' + z.color + '"/>');
        lines.push('    </g>');
      });
    } else if (z.kind === 'icon') {
      z.pts.forEach(function(p) {
        lines.push('    <g class="map-icon" transform="translate(' + p.x + ',' + p.y + ')" onclick="openCoherences(\'' + z.id + '\')">');
        lines.push('        <text x="0" y="0" text-anchor="middle" font-size="15">🏢</text>');
        lines.push('        <text x="0" y="12" text-anchor="middle" fill="#fff" font-size="7" font-weight="bold" paint-order="stroke" stroke="#000" stroke-width="2" stroke-linejoin="round">' + (z.number || '') + '</text>');
        lines.push('        <text x="0" y="21" text-anchor="middle" fill="#fff" font-size="6" paint-order="stroke" stroke="#000" stroke-width="2" stroke-linejoin="round">' + z.name.replace(/"/g,'&quot;') + '</text>');
        lines.push('    </g>');
      });
    }
    lines.push('');
  });
  lines.push('</svg>');

  // Bloc ZONE_INFOS / ZONE_COULEURS prêt à copier dans main.js
  lines.push('');
  lines.push('// ==== À ajouter/fusionner dans ZONE_COULEURS (main.js) ====');
  ZONES.filter(z => z.kind === 'poly').forEach(z => {
    lines.push(`    ${z.id}: "${z.color}",`);
  });
  lines.push('// ==== À ajouter/fusionner dans ZONE_INFOS (main.js) — pense à remplir interieurs: [] ====');
  ZONES.filter(z => z.kind === 'poly').forEach(z => {
    lines.push(`    ${z.id}: { titre: "${z.name.replace(/"/g,'\\"')}", interieurs: [] },`);
  });

  document.getElementById('out').textContent = lines.join('\n');
}

function doCopy() {
  var t = document.getElementById('out').textContent;
  navigator.clipboard.writeText(t).then(function() {
    var b = document.getElementById('copybtn');
    b.textContent = 'Copié !';
    setTimeout(function(){ b.textContent = 'Copier le code'; }, 2000);
  });
}

// ============================================================
//  NAVIGATION CARTE (pan / zoom)
// ============================================================
wrap.addEventListener('wheel', function(e) {
  e.preventDefault();
  var speed = 0.1;
  var rect  = wrap.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;
  var tx = (mx - ms.x) / ms.zoom;
  var ty = (my - ms.y) / ms.zoom;
  ms.zoom *= (e.deltaY < 0) ? (1 + speed) : (1 - speed);
  ms.zoom = Math.max(0.3, Math.min(ms.zoom, 5));
  ms.x = mx - tx * ms.zoom;
  ms.y = my - ty * ms.zoom;
  mc.style.transform = 'translate(' + ms.x + 'px,' + ms.y + 'px) scale(' + ms.zoom + ')';
}, { passive:false });

wrap.addEventListener('mousedown', function(e) {
  if (e.button !== 2) return;
  e.preventDefault();
  ms.drag = true;
  ms.sx = e.clientX - ms.x;
  ms.sy = e.clientY - ms.y;
});
window.addEventListener('mousemove', function(e) {
  if (!ms.drag) return;
  ms.x = e.clientX - ms.sx;
  ms.y = e.clientY - ms.sy;
  mc.style.transform = 'translate(' + ms.x + 'px,' + ms.y + 'px) scale(' + ms.zoom + ')';
});
document.getElementById('form-image-file').addEventListener('change', e => {
  _imageFormFile = e.target.files[0] || null;
  renderImagePreview();
});
window.addEventListener('mouseup', function() { ms.drag = false; });
wrap.addEventListener('contextmenu', function(e) { e.preventDefault(); });

// Fermer le formulaire avec Echap, valider avec Entrée
document.addEventListener('keydown', e => {
  if (!document.getElementById('overlay-form').classList.contains('open')) return;
  if (e.key === 'Escape') fermerFormZone();
  if (e.key === 'Enter' && document.activeElement.id === 'form-nom') validerFormZone();
});
document.getElementById('overlay-form').addEventListener('click', e => {
  if (e.target.id === 'overlay-form') fermerFormZone();
});

buildPanel();
genCode();
</script>
</body>
